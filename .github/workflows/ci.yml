# Lint -> test -> build once -> smoke test -> scan -> publish the tested image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Check formatting with ruff
        run: python -m ruff format --check .

      - name: Run unit and smoke-check tests
        run: python -m pytest -v

  docker:
    name: Build, smoke test, and publish image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Labels are applied here so publication does not require another build.
      - name: Build image once and load it for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: smoke-test:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        timeout-minutes: 2
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          docker run -d --name smoke -p 127.0.0.1:8000:8000 smoke-test:ci
          python3 scripts/smoke_test.py --expected-version "$EXPECTED_VERSION"

      # Informational: findings are visible in logs but do not block publication.
      - name: Scan image with Trivy (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 5
        continue-on-error: true
        with:
          image-ref: smoke-test:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retag the existing local image; do not rebuild after the smoke test.
      - name: Push the tested image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tested_image_id=$(docker image inspect --format '{{.Id}}' smoke-test:ci)
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag smoke-test:ci "$tag"
            published_image_id=$(docker image inspect --format '{{.Id}}' "$tag")
            [ "$tested_image_id" = "$published_image_id" ]
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Show container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Remove smoke-test container
        if: always()
        run: docker rm -f smoke || true
